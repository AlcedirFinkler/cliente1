{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <style> 
        .sidenav {
          height: 100%;
          width: 250px;
          position: fixed;
          z-index: 1;
          top: 0;
          left: 0;
          background-color: #313541;
          overflow-x: hidden;
          padding-top: 20px;
        }
        
        .sidenav a {
          padding-left: 32px;
          padding-bottom: 12px;
          text-decoration: none;
          font-size: 20px;
          color: #818181;
          display: block;
        }
        
        .sidenav h1 {
          padding-top: 20px;
          padding-left: 32px;
          text-decoration: none;
          font-size: 30px;
          color: #c4c4c4;
          display: block;
        }

        .sidenav a:hover {
          color: #f1f1f1;
        }

        .sidenav .bottom-links {
          position: absolute;
          bottom: 0;
          width: 100%;
          margin-bottom: 35px;
        }

        .sidenav .bottom-links .logout-link {
          color: rgb(253, 92, 92);
        }

        .sidenav .bottom-links .logout-link:hover {
          color: rgb(255, 0, 0);
        }

        .sidenav img {
          display: block;
          margin: 0 auto 20px auto;
          width: 80%;
          height: auto;
        }
        
        main {
          margin-left: 250px; /* mesmo da sidenav */
        }

        .header {
          position: fixed;
          width: 100%;
          z-index: 2;
          top: 0;
          left: 0;
          background-color: #fff;
        }

        
        .custom-button {
          background-color: #3C93DA;
          border: none;
          color: white;
          padding: 10px 24px;
          text-align: center;
          text-decoration: none;
          display: inline-block;
          font-size: 16px;
          margin: 4px 2px;
          cursor: pointer;
          border-radius: 4px;
        }

        .custom-button:hover {
            background-color: #28608f;
        }

        .table-button {
          padding: 5px 20px;
          font-size: 14px;
          display: inline-block;
          margin: 0 auto;
        }
        
        .top-side {
            margin-top: 15px;
            margin-right: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 5vh;
        }
        
        @media screen and (max-height: 450px) {
          .sidenav {padding-top: 15px;}
          .sidenav a {font-size: 18px;}
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Chamados{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" type="text/css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script>
    function detectarDispositivo() {
        const larguraTela = window.innerWidth;
        const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent);

        if (isMobile || larguraTela <= 768) {  // Detecta tamanho de tela pequeno ou userAgent de dispositivo móvel
            return ('mobile');
            // document.body.classList.add('mobile');
        } 
    }
    </script>
</head>
<body>
    <div class="sidenav">
        <img src="{% static 'images/logo.png' %}" alt="Logo">
        <h1>Módulos</h1>
        <a href="{% url 'tela_inicial' %}" class="action-link"> Gestão OSs</a>
        <a href="{% url 'listar_manutencoes' %}" class="action-link"> Mant. Preventivas</a>
        <a href="{% url 'cadEstoque' %}" class="action-link"> Estoque</a>
        <a href="{% url 'CadEquip' %}" class="action-link"> Equipamentos</a>
        <a href="{% url 'CadFornecedor' %}" class="action-link"> Fornecedores</a>
        <a href="{% url 'listar_usuarios_pendentes' %}" class="action-link"> Usuários</a>
        <a href="{% url 'relatorios_index' %}" class="action-link"> Relatórios</a>
        <div class="bottom-links">
            <a href="{% url 'modulos' %}" class="action-link">Voltar</a>
            <a href="{% url 'login' %}" class="action-link logout-link">Sair</a>
        </div>
      </div>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
