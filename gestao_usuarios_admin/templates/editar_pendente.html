{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Editar Usuário Pendente</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Usuário</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="id_email">Email</label>
            {{ form.email }}
        </div>
        <div class="form-group">
            <label for="id_grupo">Grupo</label>
            {{ form.grupo }}
        </div>
        <div class="form-group">
            <label for="id_senha">Senha (opcional)</label>
            {{ form.senha }}
        </div>
        <div class="form-group">
            <label for="id_is_approved">Status</label>
            {{ form.is_approved }}
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'listar_usuarios_pendentes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
