{% extends "base.html" %}
{% load static %}
{% block title %}GESTOR - Relatórios{% endblock %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }
        nav {
            margin-bottom: 20px;
        }
        .nav-link {
            color: #333;
        }
        .nav-link:hover {
            color: #007BFF;
        }
        .sidenav a, .sidenav h1 {
            all: unset;
            display: block;
            text-decoration: none;
            font-family: 'Roboto', sans-serif;
        }
        .sidenav a {
            padding-left: 32px;
            padding-bottom: 5px;
            font-size: 20px;
            color: #818181;
        }
        .sidenav h1 {
            padding-top: 14px;
            padding-bottom: 11px;
            padding-left: 32px;
            font-size: 30px;
            color: #c4c4c4;
            font-weight: bold;
        }
        
        .sidenav .bottom-links {
            position: absolute;
            bottom: 0;
            width: 100%;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'relatorio_chamados' %}">Chamados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'relatorio_pecas' %}">Peças</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'relatorio_tecnicos' %}">Técnicos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'relatorio_indicadores' %}">Indicadores</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>

{% endblock %}
