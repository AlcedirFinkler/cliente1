<!-- {% load static %} -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        /* Resetando margens e garantindo que o HTML e body ocupem toda a tela */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Container principal com flexbox para centralização */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estilo do container principal - responsivo */
        .login-container {
            background: #ffffff;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Versão mobile - ocupa toda a tela */
        @media (max-width: 768px) {
            .login-container {
                width: 100%;
                height: 100%;
                border-radius: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        /* Versão desktop - 20% horizontal e 35% vertical */
        @media (min-width: 769px) {
            .login-container {
                width: 20%;
                height: 55%;
                min-width: 300px;
                min-height: 400px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        /* Estilo da imagem */
        .login-logo img {
            max-width: 100%;
            height: auto;
            max-height: 120px; /* Limita a altura da imagem */
            margin-bottom: 20px;
        }

        /* Estilo do botão */
        button {
            background-color: #1644c2;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1644c2;
        }

        /* Links */
        a {
            text-decoration: none;
            color: #007BFF;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Alinha os campos de texto e os inputs verticalmente */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        /* Ajusta os inputs para ficarem maiores */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Para garantir que o padding não afete a largura */
        }

        /* Mensagens de alerta */
        .messages {
            margin-bottom: 20px;
            width: 100%;
        }

        .alert {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 14px;
        }

        .alert.error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .alert.success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        /* Reduz o tamanho do título h1 (Login) */
        h1 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        /* Reduz o tamanho do texto dos campos de entrada */
        label {
            font-size: 16px;
            align-self: flex-start;
        }

        /* Estilos para o form em si */
        .form-content {
            width: 90%;
            max-width: 300px;
            margin: 0 auto;
        }

        /* Para garantir que o form e seus elementos filhos fiquem bem formatados */
        .form-group {
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="form-content">
            <!-- Logo acima do formulário -->
            <div class="login-logo">
                <img src="{% static 'images/logo.png' %}" alt="Logo">
            </div>

            <h1>Login</h1>
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Entrar</button>
            </form>
            <p><a href="{% url 'cadastro' %}">Cadastre-se</a></p>
        </div>
    </div>
</body>
</html>
