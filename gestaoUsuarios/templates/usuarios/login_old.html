<!-- {% load static %} -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        /* Centralização da página */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Estilo do container principal */
        .login-container {
            width: 300px;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        /* Estilo da imagem */
        .login-logo img {
            max-width: 100%;
            height: auto;
            max-height: 120px; /* Limita a altura da imagem */
            margin-bottom: 20px;
        }

        /* Estilo do botão */
        button {
            background-color: #1644c2;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #1644c2;
        }

        /* Links */
        a {
            text-decoration: none;
            color: #007BFF;
        }

        a:hover {
            text-decoration: underline;
        }

                /* Alinha os campos de texto e os inputs verticalmente */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }

        /* Ajusta os inputs para ficarem maiores */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Para garantir que o padding não afete a largura */
        }

        /* Mensagens de alerta */
        .messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 14px;
        }

        .alert.error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .alert.success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

                /* Reduz o tamanho do título h1 (Login) */
        h1 {
            font-size: 20px; /* Ajuste o tamanho conforme necessário */
            margin-bottom: 15px;
        }

        /* Reduz o tamanho do texto dos campos de entrada */
        label {
            font-size: 16px; /* Tamanho reduzido para os labels de entrada */
        }
    </style>

</head>
<body>
    <div class="login-container">
        <!-- Logo acima do formulário -->
        <div class="login-logo">
            <img src="{% static 'images/logo.png' %}" alt="Logo">
        </div>

        <h1>Login</h1>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>
        <p><a href="{% url 'cadastro' %}">Cadastre-se</a></p>
    </div>
</body>
</html>
