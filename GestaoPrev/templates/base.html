{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestão de manutenções preventivas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script>
    function detectarDispositivo() {
        const larguraTela = window.innerWidth;
        const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent);

        if (isMobile || larguraTela <= 768) {  // Detecta tamanho de tela pequeno ou userAgent de dispositivo móvel
            return ('mobile');
            // document.body.classList.add('mobile');
        } 
    }
    </script>
</head>
<body>
    <header class="header">
        <img src="{% static 'images/logo.png' %}" alt="Logo">
        <h1>{% block header %}Bem-vindo ao Sistema{% endblock %}</h1>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
